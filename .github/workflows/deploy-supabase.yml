name: Deploy Supabase edge functions

# runs when edge function code changes on main. Netlify deploys the frontend by itself.
# daatabase migrations are not run from CI (apply them manually with the CLI).
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
